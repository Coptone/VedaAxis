services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vedaaxis
      POSTGRES_USER: vedaaxis
      POSTGRES_PASSWORD: vedaaxis_dev
    ports:
      - "5432:5432"
    volumes:
      - vedaaxis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vedaaxis -d vedaaxis"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - vedaaxis-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vedaaxis-postgres:
  vedaaxis-redis:
