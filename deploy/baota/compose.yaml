name: vedaaxis

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: vedaaxis
      POSTGRES_USER: vedaaxis
      POSTGRES_PASSWORD: ${VEDAAXIS_DB_PASSWORD:?set VEDAAXIS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vedaaxis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vedaaxis -d vedaaxis"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  vedaaxis-postgres:
    name: vedaaxis-postgres
