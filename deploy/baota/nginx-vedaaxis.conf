# VEDAAXIS-START
# Included inside the existing coptone.link server block.
# The existing site root and its other routes are intentionally untouched.

location = /VedaAxis {
    return 301 /VedaAxis/;
}

location ^~ /VedaAxis/api/ {
    proxy_pass http://127.0.0.1:18085/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
}

location = /VedaAxis/health {
    proxy_pass http://127.0.0.1:18085/actuator/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location ^~ /VedaAxis/release/ {
    root /www/wwwroot;
    try_files $uri =404;
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
}

location = /VedaAxis/pluginmaster.json {
    root /www/wwwroot;
    try_files $uri =404;
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
}

location ^~ /VedaAxis/ {
    root /www/wwwroot;
    try_files $uri $uri/ /VedaAxis/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
# VEDAAXIS-END
